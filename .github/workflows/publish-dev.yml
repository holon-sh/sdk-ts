# Every merge to main publishes a dev build, 0.0.1-dev.<run number>, under npm's latest tag, so a
# plain `npm install holon-sh` gets the newest one. npm trusts this workflow by name to publish.
name: Publish dev release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      version: 0.0.1-dev.${{ github.run_number }}
  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Update npm for trusted publishing
        run: npm install -g npm@11
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist
      - run: npm publish ./dist/holon-sh-*.tgz --tag latest --access public --provenance
