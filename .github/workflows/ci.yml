name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run docs:build
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-reference-typescript
          path: packages/node/docs/_build/bundle/
          if-no-files-found: error
      - run: npm pack -w packages/node
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: holon-*.tgz
