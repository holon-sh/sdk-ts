name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/fetch-mcptype.mjs
      - run: npm ci
        env:
          HOLON_SKIP_POSTINSTALL: "1"
      - run: npm test
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: apps
          path: holon-sh-*.tgz
