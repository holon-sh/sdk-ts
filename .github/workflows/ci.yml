name: CI
on:
  pull_request:
  workflow_dispatch:
  # publish-dev.yml runs this first on every merge to main.
  workflow_call:
    inputs:
      version:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        dependencies: [latest]
        include:
          # The oldest @modelcontextprotocol/client holon-sh allows, on the oldest Node it supports.
          - node: 22
            dependencies: lowest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install the oldest allowed @modelcontextprotocol/client
        if: matrix.dependencies == 'lowest'
        run: npm install --no-save "@modelcontextprotocol/client@$(node -p 'require("./packages/node/package.json").dependencies["@modelcontextprotocol/client"].replace(/^\D+/, "")')"
      - run: npm test
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set the package version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --workspaces --no-git-tag-version
      - run: npm run lint:package
      - uses: actions/checkout@v7
        with:
          repository: holon-sh/cli
          ref: b46bc5980faf8d9a6b4ab19243371466a31daf75
          path: .cli
      - uses: actions/setup-go@v7
        with:
          go-version-file: .cli/go.mod
          cache-dependency-path: .cli/go.sum
      - name: Verify generated clients against the packed SDK
        run: .cli/scripts/test-sdk-consumers node holon-sh-*.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: holon-*.tgz
