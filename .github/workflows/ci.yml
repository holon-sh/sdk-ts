name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        dependencies: [latest]
        include:
          # The oldest @modelcontextprotocol/client holon-sh allows, on the oldest Node it supports.
          - node: 22
            dependencies: lowest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install the oldest allowed @modelcontextprotocol/client
        if: matrix.dependencies == 'lowest'
        run: npm install --no-save "@modelcontextprotocol/client@$(node -p 'require("./packages/node/package.json").dependencies["@modelcontextprotocol/client"].replace(/^\D+/, "")')"
      - run: npm test
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm pack -w packages/node
      - run: npm run lint:package
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: holon-*.tgz
